version: "3.8"

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: tourism_platform_web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/apps/web/.next
    restart: unless-stopped
